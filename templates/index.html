<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--side:#1c1c1c;--acc:#1c1c1c;--blue:#4a4a4a;--bg:#eef0f2;--card:#fafaff;--tx:#1c1c1c;--mut:#6b6b68;--hd:#daddd8;--bd:#ecebe4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{color-scheme:light}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:14px system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
aside{position:sticky;top:0;height:100vh;width:210px;background:var(--side);color:#ecebe4;padding:18px 0;display:flex;flex-direction:column;flex-shrink:0}
.u{display:flex;gap:10px;align-items:center;padding:0 18px 20px;font-weight:600}.av{width:34px;height:34px;border-radius:50%;background:#daddd8;display:grid;place-items:center;color:#1c1c1c}
#nav{display:flex;flex-direction:column}aside a{display:block;padding:11px 18px;cursor:pointer;color:#daddd8;white-space:nowrap}aside a.on{background:#3a3a3a;color:#fff;font-weight:600}
main{flex:1;padding:22px 28px;min-width:0}h2{font-size:15px;margin:22px 0 10px;letter-spacing:.5px}h1{font-size:20px;margin:0 0 4px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}.row>div{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:12px}
input,select{padding:8px 10px;border:1px solid var(--bd);border-radius:7px;background:var(--card);color:var(--tx);font:inherit;min-width:120px}
button{border:0;border-radius:18px;padding:9px 24px;color:#fff;font-weight:700;cursor:pointer;background:var(--acc);box-shadow:0 4px 10px rgba(0,0,0,.18)}button.b{background:var(--blue)}button.g{background:#8e908b}button.r{background:#d9473f;padding:5px 12px}
.tw{overflow-x:auto;border-radius:8px;border:1px solid var(--bd);max-height:340px;overflow-y:auto;background:var(--card)}
table{width:100%;border-collapse:collapse;text-align:center}th{background:var(--hd);padding:9px;position:sticky;top:0}td{padding:8px;border-top:1px solid var(--bd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 6px 16px rgba(120,125,135,.18)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.stats .card{text-align:center;margin:0}.stats b{display:block;font-size:26px;color:var(--tx)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.mut{color:var(--mut)}
.chip{display:inline-block;margin:2px;padding:2px 7px;border-radius:5px;background:var(--hd);font-size:12px}.hit{background:var(--acc);color:#fff}
#lg{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}.pg{display:none}.pg.on{display:block}button:hover{filter:brightness(1.2)}aside a:hover{background:#2e2e2e}input:focus,select:focus{outline:2px solid #1c1c1c55}tbody tr:hover td,table tr:hover td{background:#eef0f2}h1{font-size:22px}.tw{box-shadow:0 6px 16px rgba(120,125,135,.15)}input,select{height:38px}#er{visibility:hidden;height:0;overflow:hidden}#er.on{visibility:visible;height:auto;overflow:auto}
.er-canvas{margin-top:16px;padding:18px;background:#fff;border:1px solid #dfe3e8;border-radius:14px;box-shadow:0 5px 18px rgba(20,30,45,.07);overflow:auto;min-height:420px}
.er-canvas .mermaid{display:flex;justify-content:center;min-width:900px;margin:0 auto;background:transparent}
.er-canvas svg{max-width:none;height:auto}
.er-legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;color:#555;font-size:12px}
.er-legend span{padding:7px 10px;background:#fff;border:1px solid #e1e5e9;border-radius:8px}
@media(max-width:700px){body{flex-direction:column}aside{height:auto;position:static;width:100%;flex-direction:row;align-items:center;overflow-x:auto;padding:6px}.u{display:none}#nav{flex-direction:row}main{padding:14px}}

async function login() {
    const u = $('lu').value.trim();
    const p = $('lp').value;
    const expectedRole = role === 'invigilator' ? 'faculty' : role;

    try {
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: role === 'student' ? u.toUpperCase() : u,
                password: p
            })
        });

        const data = await response.json();

        if (!response.ok) {
            return alert(data.message || 'Invalid credentials');
        }

        if (data.role !== expectedRole) {
            await fetch('/api/logout', { method: 'POST' });
            return alert('Please select the correct login role.');
        }

        if (role === 'admin') {
            me = { id: 'admin', name: 'Admin' };
        } else if (role === 'student') {
            const s = stu.find(x => x[0] === data.student_roll_no);
            me = {
                id: data.student_roll_no,
                name: s ? s[1] : data.username
            };

            me = {
                id: data.faculty_id,
                name: fN(data.faculty_id)

        }

        $('lg').style.display = 'none';
        $('un').textContent = me.name;
        $('av').textContent = me.name[0];

        pages = RP[role];
        go(pages[0][0]);

    } catch (error) {
        alert('Cannot connect to the server. Check Flask.');
        console.error(error);
    }
}

async function apiRequest(url, options={}) {
    const response = await fetch(url, options);
    let data = {};
    try { data = await response.json(); } catch (_) {}
    if (!response.ok) throw new Error(data.message || `Request failed (${response.status})`);
    return data;
}
function isoDate(value) {
    if (!value) return '';
    const raw = String(value);
    if (/^\d{4}-\d{2}-\d{2}/.test(raw)) return raw.slice(0,10);
    const parsed = new Date(raw);
    return Number.isNaN(parsed.getTime()) ? raw : parsed.toISOString().slice(0,10);
}
function prettyDate(value) { const d=isoDate(value); return d ? fd(d) : '—'; }
function setLoading(id, title) { $(id).innerHTML=`<h1>${title}</h1><p class="mut">Loading from MySQL...</p>`; }

}

    if(!confirm('Delete this exam and its seat allocations?'))return;
    try { await apiRequest(`/api/exams/${id}`,{method:'DELETE'}); await exs(); alert('Exam deleted from MySQL.'); }
    catch(e){alert(e.message);}
}
async function clr() {
    if(!confirm(`Delete all exams of semester ${sem}?`))return;
    try { await apiRequest(`/api/exams/semester/${sem}`,{method:'DELETE'}); await exs(); alert('Semester exams cleared from MySQL.'); }
    catch(e){alert(e.message);}
}

let currentSlots=[];
async function seats() {
    setLoading('seats','Seat Allocation');
    try {
        const data=await apiRequest('/api/slots'); currentSlots=data.slots.map(s=>({id:s.slot_id,date:isoDate(s.exam_date),shift:s.shift}));
        if(!currentSlots.length){$('seats').innerHTML='<h1>Seat Allocation</h1><p class="mut">No exam slots exist. Schedule exams first.</p>';return;}
        if(!slotSel||!currentSlots.some(s=>`${s.date}|${s.shift}`===slotSel))slotSel=`${currentSlots[0].date}|${currentSlots[0].shift}`;
        $('seats').innerHTML=`<h1>Seat Allocation</h1><div class="row"><div>Exam slot<select id="seatSlot" onchange="slotSel=this.value;show()">${currentSlots.map(s=>{const v=`${s.date}|${s.shift}`;return `<option value="${v}" ${v===slotSel?'selected':''}>${prettyDate(s.date)} - ${s.shift}</option>`}).join('')}</select></div><button onclick="alloc()">ALLOCATE SEATS &amp; INVIGILATORS</button></div><div id="sr"></div>`;
        await show();
    } catch(e){$('seats').innerHTML=`<h1>Seat Allocation</h1><p class="mut">${e.message}</p><button onclick="seats()">RETRY</button>`;}
}
async function show() {
    if(!slotSel)return;
    const [d,h]=slotSel.split('|'); $('sr').innerHTML='<p class="mut">Loading allocations...</p>';
    try {
        const [aData,iData]=await Promise.all([
            apiRequest(`/api/allocations?exam_date=${encodeURIComponent(d)}&shift=${encodeURIComponent(h)}`),
            apiRequest('/api/invigilation')
        ]);
        const allocations=aData.allocations, duties=iData.duties.filter(i=>isoDate(i.exam_date)===d&&i.shift===h);
        const exams=ex.filter(e=>e.date===d&&e.sh===h); const by={};
        allocations.forEach(a=>(by[a.room_id]=by[a.room_id]||[]).push(a));
        $('sr').innerHTML=`<p class="mut">${exams.length} exams &middot; ${allocations.length} students seated &middot; ${Object.keys(by).length} rooms</p>`+
        (Object.keys(by).map(id=>{const a=by[id].sort((x,y)=>x.seat_no-y.seat_no),names=duties.filter(i=>i.room_id==id).map(i=>i.faculty_name).join(', ')||'<i>not assigned</i>';return `<div class="card"><b>${a[0].room_name}</b> &middot; ${a.length} students &middot; Invigilators: ${names}<div style="margin-top:6px">${a.map(x=>`<span class="chip">${x.seat_no}: ${x.roll_no}</span>`).join('')}</div></div>`}).join('')||'<p class="mut">No seats allocated yet. Click Allocate.</p>');
    } catch(e){$('sr').innerHTML=`<p class="mut">${e.message}</p>`;}
}
async function alloc() {
    if(!slotSel)return alert('No exam slot selected.');
    const [d,h]=slotSel.split('|');
    if(!confirm(`Generate seating and invigilation assignments for ${prettyDate(d)} (${h})? Existing allocations and duties in this slot will be replaced.`))return;
    try { const result=await apiRequest('/api/allocate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({exam_date:d,shift:h})}); await show(); alert(`${result.students_allocated} students allocated across ${result.rooms_used} rooms; ${result.invigilators_assigned} invigilators assigned.`); }
    catch(e){alert(e.message);}
}

async function ivp() {
    setLoading('inv','Invigilation Duties');
    try {
        const [slotsData,roomsData,dutyData,facultyData]=await Promise.all([apiRequest('/api/slots'),apiRequest('/api/rooms'),apiRequest('/api/invigilation'),apiRequest('/api/faculty')]);
        currentSlots=slotsData.slots.map(s=>({id:s.slot_id,date:isoDate(s.exam_date),shift:s.shift}));
        rooms=roomsData.rooms.map(r=>({id:r.room_id,name:r.room_name,cap:r.capacity}));
        iv=dutyData.duties.map(i=>({slotId:i.slot_id,d:isoDate(i.exam_date),sh:i.shift,room:i.room_id,fac:i.faculty_id,facultyName:i.faculty_name,roomName:i.room_name}));
        fac=facultyData.faculty.map(f=>[f.faculty_id,f.name,f.branch_code,f.email]);
        $('inv').innerHTML=`<h1>Invigilation Duties</h1><h2>ASSIGN MANUALLY</h2><div class="row"><div>Slot<select id="is">${currentSlots.map(s=>`<option value="${s.id}">${prettyDate(s.date)} - ${s.shift}</option>`).join('')}</select></div><div>Room<select id="ir">${rooms.map(r=>`<option value="${r.id}">${r.name}</option>`).join('')}</select></div><div>Faculty<select id="if">${fac.map(f=>`<option value="${f[0]}">${f[1]} (${f[2].slice(1)})</option>`).join('')}</select></div><button class="b" onclick="addIv()">ASSIGN</button></div>
        <h2>DUTY CHART</h2><div class="tw"><table><tr><th>Date</th><th>Shift</th><th>Room</th><th>Faculty</th><th></th></tr>${iv.map(i=>`<tr><td>${prettyDate(i.d)}</td><td>${i.sh}</td><td>${i.roomName}</td><td>${i.facultyName}</td><td><button class="r" onclick="delIv(${i.slotId},${i.room},${i.fac})">Remove</button></td></tr>`).join('')||'<tr><td colspan="5">No duties assigned.</td></tr>'}</table></div>`;
    } catch(e){$('inv').innerHTML=`<h1>Invigilation Duties</h1><p class="mut">${e.message}</p><button onclick="ivp()">RETRY</button>`;}
}
async function addIv() {
    const slot=Number($('is').value),room=Number($('ir').value),faculty=Number($('if').value);
    if(!slot||!room||!faculty)return alert('Select a slot, room and faculty member.');
    try { await apiRequest('/api/invigilation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slot_id:slot,room_id:room,faculty_id:faculty})}); await ivp(); alert('Invigilator assignment saved to MySQL.'); }
    catch(e){alert(e.message);}
}
async function delIv(slot,room,faculty) {
    if(!confirm('Remove this invigilation assignment?'))return;
    try { await apiRequest(`/api/invigilation/${slot}/${room}/${faculty}`,{method:'DELETE'}); await ivp(); }
    catch(e){alert(e.message);}
}

async function my() {
    setLoading('my','My Seat & Timetable');
    try {
        const data=await apiRequest('/api/student/me'),s=data.student;
        $('my').innerHTML=`<h1>Welcome, ${s.name}</h1><p class="mut">${s.roll_no} &middot; ${s.branch_code} &middot; Semester ${s.semester}</p><h2>MY SEATING &amp; EXAM TIMETABLE</h2><div class="tw"><table><tr><th>Date</th><th>Shift</th><th>Subject</th><th>Room</th><th>Seat</th></tr>${data.exams.map(e=>`<tr><td>${prettyDate(e.exam_date)}</td><td>${e.shift}</td><td>${e.subject_code} - ${e.subject_name}</td><td>${e.room_name||'Not allocated'}</td><td>${e.seat_no??'—'}</td></tr>`).join('')||'<tr><td colspan="5">No exams scheduled.</td></tr>'}</table></div>`;
    } catch(e){$('my').innerHTML=`<h1>My Seat &amp; Timetable</h1><p class="mut">${e.message}</p><button onclick="my()">RETRY</button>`;}
}
async function duty() {
    setLoading('duty','My Duties');
    try {
        const data=await apiRequest('/api/faculty/me/duties');
        $('duty').innerHTML=`<h1>My Invigilation Duties</h1>`+(data.duties.map(i=>`<div class="card"><b>${prettyDate(i.exam_date)} &middot; ${i.shift} &middot; Room ${i.room_name}</b><p>${i.students.length} students assigned</p><details><summary>Seating list</summary>${i.students.map(s=>`<span class="chip">${s.seat_no}: ${s.roll_no} - ${s.student_name}</span>`).join('')||'<p class="mut">No students allocated in this room.</p>'}</details></div>`).join('')||'<p class="mut">No duties assigned.</p>');
    } catch(e){$('duty').innerHTML=`<h1>My Invigilation Duties</h1><p class="mut">${e.message}</p><button onclick="duty()">RETRY</button>`;}
}

loginUI();
</script></body></html>
